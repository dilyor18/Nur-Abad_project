{% extends 'base.html' %}

{% block title %}Профиль | Market{% endblock %}

{% block content %}
<section class="card profile-shell">
    <div class="profile-header">
        <div>
            <p class="eyebrow">Личный кабинет</p>
            <h1 id="profile-title">Загрузка...</h1>
        </div>
        <button id="profile-logout" class="btn btn-secondary">Выйти</button>
    </div>

    <div class="profile-grid">
        <div class="profile-card card-muted">
            <div id="profile-avatar" class="avatar-placeholder">A</div>
            <div>
                <p class="muted">Email</p>
                <h3 id="profile-email">-</h3>
            </div>
        </div>

        <div class="card-muted profile-info">
            <h3>Данные профиля</h3>
            <p><strong>Имя пользователя:</strong> <span id="profile-username">-</span></p>
            <p><strong>Город:</strong> <span id="profile-city">-</span></p>
            <p><strong>Район:</strong> <span id="profile-district">-</span></p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    async function loadProfilePage() {
        const auth = JSON.parse(localStorage.getItem('market_auth') || 'null');
        if (!auth) {
            window.location.href = '/auth/';
            return;
        }

        try {
            const me = await api('/me/');
            const profile = await api('/profile/');

            document.getElementById('profile-title').textContent = me.username || 'Пользователь';
            document.getElementById('profile-email').textContent = me.email || '-';
            document.getElementById('profile-username').textContent = me.username || '-';
            document.getElementById('profile-city').textContent = profile.city || '-';
            document.getElementById('profile-district').textContent = profile.district || '-';

            const avatar = document.getElementById('profile-avatar');
            avatar.textContent = (me.username || 'U').charAt(0).toUpperCase();
        } catch (error) {
            console.error(error);
            alert(error.message || 'Не удалось загрузить профиль');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('profile-logout')?.addEventListener('click', () => {
            localStorage.removeItem('market_auth');
            window.location.href = '/';
        });
        loadProfilePage();
    });
</script>
{% endblock %}
