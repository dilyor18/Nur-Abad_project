{% extends 'base.html' %}

{% block title %}Главная | Market{% endblock %}

{% block content %}
<section class="hero card">
    <div>
        <p class="eyebrow">Площадка объявлений</p>
        <h1>Найдите то, что нужно вам</h1>
    </div>
    <button id="open-create-ad" class="btn btn-primary">Подать объявление</button>
</section>

<section class="filters card">
    <div class="search-row">
        <label class="search-field">
            <span>Поиск по названию</span>
            <input id="search-input" type="text" placeholder="Например: велосипед, ноутбук...">
        </label>
        <button id="search-button" class="btn btn-primary">Найти</button>
    </div>
</section>

<section class="content-grid">
    <aside class="card side-panel">
        <h3>Новая лента</h3>
        <div id="news-widget" class="news-list">
            <p class="muted">Загрузка новостей...</p>
        </div>
    </aside>

    <div class="ads-wrap">
        <div id="ads-grid" class="ads-grid"></div>
    </div>
</section>

<div id="create-ad-modal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Новое объявление</h3>
            <button class="close-btn" data-close="create-ad-modal">×</button>
        </div>
        <form id="create-ad-form">
            <label>
                <span>Заголовок</span>
                <input name="title" required>
            </label>
            <label>
                <span>Описание</span>
                <textarea name="description" rows="5" required></textarea>
            </label>
            <div class="grid-2">
                <label>
                    <span>Цена</span>
                    <input name="price" type="number" min="0" step="0.01" required>
                </label>
                <label>
                    <span>Состояние</span>
                    <select name="status" required>
                        <option value="ACTIVE">В продаже</option>
                        <option value="SOLD">Продан</option>
                    </select>
                </label>
            </div>
            <label>
                <span>Фото</span>
                <input name="image" type="file" accept="image/*">
            </label>

            <input type="hidden" name="category" id="create-category-hidden" value="">
            <input type="hidden" name="city" id="create-city-hidden" value="">
            <input type="hidden" name="district" id="create-district-hidden" value="">
            <input type="hidden" name="condition" id="create-condition-hidden" value="NEW">

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" data-close="create-ad-modal">Отмена</button>
                <button type="submit" class="btn btn-primary">Опубликовать</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
